# Builds the example-app APKs for a published release and attaches them to it.
#
# Runs from a clean checkout of the release tag, so no local build residue can ride into a
# published artifact (a stale cmake cache once shipped an OpenCL backend nobody chose — see
# CHANGELOG 2026-07-28). Signing uses the stable release keystore from repository secrets:
# the same key every release, so an APK update installs over the previous one without an
# uninstall (which would wipe downloaded models).
#
# Secrets:
#   RELEASE_KEYSTORE_B64      base64 of bmoe-release.jks
#   RELEASE_KEYSTORE_PASSWORD store password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
name: release-apk

on:
  release:
    types: [published]
  # Manual re-run for an existing release (e.g. to rebuild assets for an old tag).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for"
        required: true

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

  # The engine with the Hexagon NPU backend, built by scripts/build-hexagon-android.sh inside
  # upstream's Snapdragon toolchain image (the Hexagon SDK is not otherwise installable on a runner).
  # A third-party image, so it gets its own job: read-only token, no credentials left in the
  # checkout, no secrets, the image pinned by digest. It hands the libraries over as an artifact;
  # only the job below signs and publishes, and that job runs no third-party code.
  native:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Build bmoe-cli with the Hexagon backend (arm64)
        run: |
          docker run --rm -e OUT=/workspace/build-android -v "$PWD:/workspace" \
            ghcr.io/snapdragon-toolchain/arm64-android@sha256:91714433626f0d94a926538a1e46ec43756c5b8e3262b91b95df1e812940aed1 \
            bash /workspace/scripts/build-hexagon-android.sh

      # An explicit list, mirroring scripts/stage-hexagon-jnilibs.ps1: nothing else the build tree
      # holds can ride into the APK. The CLI ships as libbmoe-cli.so because Android only extracts
      # lib*.so from an APK.
      - name: Collect libraries
        run: |
          mkdir -p jni
          cp build-android/bin/bmoe-cli jni/libbmoe-cli.so
          for f in libggml.so libggml-base.so libggml-cpu.so libllama.so libllama-common.so libggml-hexagon.so \
                   libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            src=$(find build-android -name "$f" | head -1)
            test -n "$src" || { echo "$f not found"; exit 1; }
            cp "$src" "jni/$f"
          done
          # The libc++ the libraries were built against: the image's NDK, not the runner's.
          cp build-android/libc++_shared.so jni/
          ls -la jni

      - uses: actions/upload-artifact@v4
        with:
          name: jnilibs
          path: jni/
          retention-days: 1

  apk:
    needs: [tag, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - uses: actions/download-artifact@v4
        with:
          name: jnilibs
          path: jni

      - name: Stage jniLibs
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          JNI=examples/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI" && rm -f "$JNI"/*.so
          cp jni/*.so "$JNI/"
          # Strip here, not in AGP: the Gradle plugin silently skips stripping when its default
          # NDK is absent on the runner, and the first CI build shipped a 77 MB libllama-common.
          # The DSP skels are Hexagon code, not arm64: they stay as the SDK built them.
          find "$JNI" -name '*.so' ! -name 'libggml-htp-*.so' -print0 |
            xargs -0 "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded

      - name: Materialize signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > examples/android/bmoe-release.jks
          cat > examples/android/keystore.properties <<EOF
          storeFile=bmoe-release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build APKs
        run: |
          cd examples/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDevRelease assembleDevDebug

      # The whole point of building on CI: fail if anything but the chosen libraries is inside.
      - name: Verify APK contents
        run: |
          APK=examples/android/app/build/outputs/apk/dev/release/app-dev-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -q libggml-opencl; then
            echo "stray OpenCL backend in APK"; exit 1
          fi
          # The NPU prefill switch is only offered when the backend is inside.
          for f in libggml-hexagon.so libggml-htp-v73.so libggml-htp-v75.so libggml-htp-v79.so libggml-htp-v81.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "missing $f in APK"; exit 1; }
          done

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=examples/android/app/build/outputs/apk/dev
          gh release upload "${{ needs.tag.outputs.tag }}" \
            "$OUT/release/app-dev-release.apk" \
            "$OUT/debug/app-dev-debug.apk" \
            --clobber
