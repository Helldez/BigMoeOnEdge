# Builds bmoe-cli for desktop hosts when a release is published and attaches the archives to it,
# so a benchmark contributor can download one file and run scripts/bench-report.sh without a
# toolchain (docs/community-benchmarks.md). Same clean-checkout rule as release-apk.yml: nothing
# from a developer machine rides into a published artifact.
#
# One layout on every OS: the executable and, beside it, one module per backend and one CPU module
# per instruction-set tier, the best picked at start-up (BMOE_BACKEND_MODULES, the top-level
# CMakeLists). A module whose driver library the machine lacks is not loaded and the engine runs on
# the CPU, so the same archive serves a laptop with a GPU and a server without one. Vulkan rides in
# the Linux and Windows archives; Metal in the macOS one; OpenCL in the Windows ARM64 one, for the
# Adreno GPU of a Snapdragon laptop. The Hexagon NPU has archives of its own (windows-arm64-npu):
# on Windows its driver runs DSP code only from a catalog signed by a certificate the machine
# trusts, which the user sets up by hand, test-signing included (docs/npu-windows.md).
#
# iOS rides along as the harness app built for the simulator, unsigned: the one build of this
# engine for that platform anyone can run without an Apple team, on a Mac with Xcode
# (examples/ios/README.md). A device build is signed by whoever has the device.
name: release-host

on:
  release:
    types: [published]
  # A PR that edits this workflow builds all four targets as workflow artifacts: the dry run.
  pull_request:
    paths: ['.github/workflows/release-host.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (or any ref) to build; assets are named after it"
        required: true
      upload:
        description: "Attach to the release (true) or keep as workflow artifacts (false, a dry run)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image that can build a target sets the oldest distribution its archive runs
          # on, through the glibc and libstdc++ it links. x86_64 builds on 22.04 with the Vulkan
          # shader compiler from LunarG's apt repository, as llama.cpp's own release does, so the
          # archive runs where the previous ones did. aarch64 needs gcc-14 for the newest ARM tier
          # and glslc, which 22.04 on arm has neither of: it builds on 24.04, also as llama.cpp
          # does, and needs that glibc (2.38) or newer.
          - os: ubuntu-22.04
            target: linux-x86_64
            cmake_extra: -DGGML_VULKAN=ON
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            cmake_extra: -DGGML_VULKAN=ON
          - os: macos-14
            target: macos-arm64
            cmake_extra: ""
          - os: windows-latest
            target: windows-x86_64
            # The shared C runtime: modules and the engine must share one heap, which a static
            # runtime in each would not. Its DLLs travel in the archive (Package), so a machine
            # without the redistributable installed still starts the binaries.
            cmake_extra: -DGGML_VULKAN=ON
          # Built natively on an ARM64 runner, so the smoke test runs what ships. llama.cpp's own
          # recipe for this target: clang with its toolchain file (one CPU library, for the cores
          # of a Snapdragon laptop; the top-level CMakeLists has ggml build no tiers here), the
          # Vulkan module, and the OpenCL module with the Adreno kernels.
          - os: windows-11-arm
            target: windows-arm64
            cmake_extra: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=third_party/llama.cpp/cmake/arm64-windows-llvm.cmake
              -DGGML_VULKAN=ON -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
          # The same build with the Hexagon module and one DSP library per NPU generation, signed
          # in this job (Sign the NPU's DSP libraries). Its own archives, because the NPU needs the
          # user to turn test-signing on, which the plain ones must never depend on.
          - os: windows-11-arm
            target: windows-arm64-npu
            cmake_extra: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=third_party/llama.cpp/cmake/arm64-windows-llvm.cmake
              -DGGML_VULKAN=ON -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
              -DGGML_HEXAGON=ON -DPREBUILT_LIB_DIR=windows_aarch64
              "-DHEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT" "-DHEXAGON_TOOLS_ROOT=$HEXAGON_TOOLS_ROOT"
            extra_targets: htp-v73 htp-v75 htp-v79 htp-v81 htp-v85
    runs-on: ${{ matrix.os }}
    steps:
      # The tag is text someone typed: it reaches the shell as data (env), never spliced into the
      # script, and only a plain ref name goes on to the steps after this one.
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `tag` names the archives; `ref` is what gets checked out. On a PR the ref stays empty,
          # which actions/checkout reads as "this PR's merge commit".
          case "$EVENT" in
            release)           T="$RELEASE_TAG"; R="$T" ;;
            workflow_dispatch) T="$INPUT_TAG"; R="$T" ;;
            *)                 T="pr-$PR_NUMBER"; R="" ;;
          esac
          case "$T" in
            ''|*[!A-Za-z0-9._-]*) echo "not a plain tag name: '$T'"; exit 1 ;;
          esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "ref=$R" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}
          submodules: recursive

      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/check-version.sh "$TAG"

      # Vulkan needs its shader compiler and headers on the build host; the archive needs nothing
      # but a driver on the machine that runs it.
      - name: Install ninja and the Vulkan toolchain (Linux)
        if: runner.os == 'Linux'
        # 22.04 packages no glslc: the SDK comes from LunarG's repository, the recipe llama.cpp's
        # release uses there. On 24.04, gcc-14: the compiler it ships (13) does not build the
        # newest ARM tier of the CPU backend; the same workaround llama.cpp uses on that image.
        run: |
          if [ "$(lsb_release -rs)" = "22.04" ]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build vulkan-sdk
          else
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build glslc libvulkan-dev spirv-headers gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.4.357.0"
          # LunarG publishes the ARM64 SDK, a native glslc included, under its own path.
          $url = if ($env:RUNNER_ARCH -eq "ARM64") { "https://sdk.lunarg.com/sdk/download/$v/warm/vulkansdk-windows-ARM64-$v.exe" } else { "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" }
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L $url
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$v"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$v\bin"

      # clang finds the MSVC libraries and the Windows SDK through the environment vcvarsall sets
      # up, which a job step does not start with: carried into the steps after this one.
      - name: The MSVC environment (Windows ARM64)
        if: startsWith(matrix.target, 'windows-arm64')
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])" }
          }

      # The OpenCL module links the ICD loader; the archive does not carry it, since the GPU driver
      # installs its own beside the system, and without one the module is simply not loaded.
      # Pinned releases of Khronos's headers and loader, built for this machine, as llama.cpp does.
      - name: Install the OpenCL headers and ICD loader (Windows ARM64)
        if: startsWith(matrix.target, 'windows-arm64')
        shell: pwsh
        run: |
          $v = "v2026.05.29"
          $prefix = "$env:RUNNER_TEMP\opencl"
          git clone -q --depth 1 --branch $v https://github.com/KhronosGroup/OpenCL-Headers "$env:RUNNER_TEMP\ocl-headers"
          cmake -S "$env:RUNNER_TEMP\ocl-headers" -B "$env:RUNNER_TEMP\ocl-headers\build" -DBUILD_TESTING=OFF -DOPENCL_HEADERS_BUILD_TESTING=OFF -DOPENCL_HEADERS_BUILD_CXX_TESTS=OFF "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build "$env:RUNNER_TEMP\ocl-headers\build" --target install
          git clone -q --depth 1 --branch $v https://github.com/KhronosGroup/OpenCL-ICD-Loader "$env:RUNNER_TEMP\ocl-loader"
          cmake -S "$env:RUNNER_TEMP\ocl-loader" -B "$env:RUNNER_TEMP\ocl-loader\build" -A arm64 -DBUILD_TESTING=OFF "-DCMAKE_PREFIX_PATH=$prefix" "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build "$env:RUNNER_TEMP\ocl-loader\build" --target install --config Release
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      # llama.cpp's own installer for the Windows on Snapdragon build of the Hexagon SDK: it checks
      # the archive's SHA-256 and unpacks it under C:\Qualcomm. The version is its default.
      - name: Install the Hexagon SDK (Windows ARM64 NPU)
        if: matrix.target == 'windows-arm64-npu'
        shell: pwsh
        run: |
          python third_party/llama.cpp/scripts/snapdragon/setup-sdk.py --hexagon
          $sdk = Get-ChildItem C:\Qualcomm\Hexagon_SDK -Directory | Select-Object -First 1
          $tools = Get-ChildItem "$($sdk.FullName)\tools\HEXAGON_Tools" -Directory | Select-Object -First 1
          # Forward slashes: these reach CMake as -D values, where a backslash would be read as an escape.
          Add-Content $env:GITHUB_ENV "HEXAGON_SDK_ROOT=$($sdk.FullName -replace '\\', '/')"
          Add-Content $env:GITHUB_ENV "HEXAGON_TOOLS_ROOT=$($tools.FullName -replace '\\', '/')"

      # The desktop app's web UI, built from the same checkout; the server build stages it beside
      # the binary (server/stage_assets.cmake).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the web UI
        shell: bash
        run: cd ui && npm ci && npm test && npm run build

      - name: Configure & build
        shell: bash
        run: |
          GEN=""
          if [ "${{ runner.os }}" != "Windows" ]; then GEN="-G Ninja"; fi
          cmake -S . -B build $GEN \
            -DCMAKE_BUILD_TYPE=Release \
            -DBMOE_BUILD_TESTS=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            ${{ matrix.cmake_extra }}
          cmake --build build --config Release -j --target bmoe-cli bmoe-server bmoe-server-assets ${{ matrix.extra_targets }}

      # The catalog the NPU driver checks, libggml-htp.cat, made by Inf2Cat from upstream's
      # libggml-htp.inf and signed with a certificate made here. Its private key never leaves this
      # job: it is deleted from the store once the catalog is signed, so nothing else can ever be
      # signed with it, and only the public certificate ships for the user to trust. Inf2Cat comes
      # from Microsoft's WDK package on NuGet (the runner has no WDK); signtool from the SDK.
      - name: Sign the NPU's DSP libraries (Windows ARM64 NPU)
        if: matrix.target == 'windows-arm64-npu'
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $wdk = "10.0.28000.2526"
          curl.exe -sSL -o "$env:RUNNER_TEMP\wdk.zip" "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.arm64/$wdk/microsoft.windows.wdk.arm64.$wdk.nupkg"
          Expand-Archive "$env:RUNNER_TEMP\wdk.zip" "$env:RUNNER_TEMP\wdk"
          $inf2cat = (Get-ChildItem "$env:RUNNER_TEMP\wdk\c\bin\*\x86\Inf2Cat.exe" | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\arm64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $stage = "$env:RUNNER_TEMP\htp"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build\third_party\llama.cpp\ggml\src\ggml-hexagon\libggml-htp-v*.so $stage
          Copy-Item third_party\llama.cpp\ggml\src\ggml-hexagon\libggml-htp.inf $stage
          & $inf2cat /driver:$stage /os:10_25H2_ARM64
          if ($LASTEXITCODE) { throw "Inf2Cat failed ($LASTEXITCODE)" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=BigMoeOnEdge NPU $env:TAG" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          & $signtool sign /fd sha256 /sha1 $cert.Thumbprint /s My "$stage\libggml-htp.cat"
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)" }
          Export-Certificate -Cert $cert -FilePath "$stage\bigmoeonedge-npu.cer" | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          Remove-Item "$stage\libggml-htp.inf"
          Get-ChildItem $stage | Format-Table Name, Length
          Add-Content $env:GITHUB_ENV "HTP_STAGE=$stage"

      - name: Package
        id: pkg
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The engine and its libraries travel together: ggml and llama, and one module per
          # backend, which ggml finds beside the executable at start-up.
          libs() { # <dir>: copy every shared library the build put beside the executables
            # -P keeps the soname symlinks as symlinks (libggml.so.0 -> libggml.so.0.x.y): the
            # executables name the versioned ones, and tar carries symlinks as they are.
            # On macOS the shared libraries are .dylib and the modules .so; both travel.
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp build/bin/Release/*.dll "$1/"
              # The C++ runtime the binaries were linked against, copied beside them (the
              # redistributable allows this local deployment): without it a machine that never
              # installed the redistributable cannot start the program at all. The universal CRT
              # ships with Windows itself.
              # vcruntime140_1 holds the x64 exception handling: the ARM64 redistributable carries an
              # x64 copy of it for emulated programs, which nothing here loads, so it stays out.
              case "${{ matrix.target }}" in
                windows-arm64*) ARCH=arm64; WANT="msvcp140.dll vcruntime140.dll" ;;
                *) ARCH=x64; WANT="msvcp140.dll vcruntime140.dll vcruntime140_1.dll" ;;
              esac
              VS="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products "*" -property installationPath)"
              CRT="$(ls -d "$(cygpath -u "$VS")"/VC/Redist/MSVC/*/$ARCH/Microsoft.VC*.CRT | sort | tail -1)"
              cp "$CRT"/msvcp140*.dll "$CRT"/vcruntime140*.dll "$1/"
              if [ "$ARCH" = arm64 ]; then rm -f "$1/vcruntime140_1.dll"; fi
              for d in $WANT; do
                [ -f "$1/$d" ] || { echo "the C++ runtime is missing $d in $1"; exit 1; }
              done
            elif [ "${{ runner.os }}" = "macOS" ]; then cp -P build/bin/*.dylib build/bin/*.so "$1/"; strip -x "$1"/*.dylib "$1"/*.so || true;
            else cp -P build/bin/*.so* "$1/"; strip "$1"/*.so* || true; fi
            ls "$1" | grep -q 'ggml-cpu' || { echo "no CPU backend module in $1"; exit 1; }
            # And the GPU module this archive promises: a Vulkan SDK step that failed quietly would
            # otherwise ship a CPU-only archive under the name of one that carries Vulkan.
            case "${{ matrix.target }}" in
              macos-*) ls "$1" | grep -q 'ggml-metal' || { echo "no Metal backend module in $1"; exit 1; } ;;
              *) ls "$1" | grep -q 'ggml-vulkan' || { echo "no Vulkan backend module in $1"; exit 1; } ;;
            esac
            case "${{ matrix.target }}" in
              windows-arm64*) ls "$1" | grep -q 'ggml-opencl' || { echo "no OpenCL backend module in $1"; exit 1; } ;;
            esac
            # The NPU archives carry the Hexagon module, its DSP libraries, the signed catalog and
            # the certificate that signed it; the guide says what to do with them.
            if [ "${{ matrix.target }}" = windows-arm64-npu ]; then
              ls "$1" | grep -q 'ggml-hexagon' || { echo "no Hexagon backend module in $1"; exit 1; }
              cp "$(cygpath -u "$HTP_STAGE")"/* "$1/"
              for f in libggml-htp.cat bigmoeonedge-npu.cer libggml-htp-v73.so; do
                [ -f "$1/$f" ] || { echo "the NPU archive is missing $f in $1"; exit 1; }
              done
            fi
          }
          NAME="bmoe-cli-$TAG-${{ matrix.target }}"
          mkdir -p "$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/Release/bmoe-cli.exe "$NAME/"
          else
            cp build/bin/bmoe-cli "$NAME/"
            strip "$NAME/bmoe-cli" || true
          fi
          libs "$NAME"
          cp LICENSE "$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE='.\bmoe-cli.exe'; SHELL_NAME='PowerShell or cmd'
          else
            EXE='./bmoe-cli'; SHELL_NAME='a terminal'
          fi
          cat > "$NAME/README.txt" <<EOF
          bmoe-cli $TAG, ${{ matrix.target }}

          This is a command-line program. Double-clicking it opens a console that closes again at
          once, because it was given no model. Open $SHELL_NAME in this folder and run:

            $EXE -m path/to/model.gguf --moe-stream --overlap --dense-weights anon --cache-mb 2000 --io-threads 4 -t 8 -n 64 --chatml --no-think -p "Explain MoE routing."

          -m is the only required flag; $EXE --help lists the rest. Any MoE model llama.cpp loads
          streams (docs/which-models-stream.md in the repository). Keep this folder together: the
          libraries beside the program are its compute backends, loaded at start-up. The CPU one
          comes in several instruction-set tiers and the best for this machine is picked; a GPU
          backend loads only where its driver is installed, and the plan (--auto --plan-explain)
          says which devices were found. The Linux x86_64 archive runs on Ubuntu 22.04 and newer
          distributions; the aarch64 one needs glibc 2.38 or newer (Ubuntu 24.04, Debian 13,
          Fedora 39). On an older distribution build from source with scripts/build-host.sh, one
          command.

          Benchmark on this machine, printing the tables for a benchmark-report issue (Linux and
          macOS; on Windows run the protocol command from docs/community-benchmarks.md by hand):
            BMOE_CLI=\$PWD/bmoe-cli scripts/bench-report.sh /path/to/model.gguf
          from a checkout of https://github.com/Helldez/BigMoeOnEdge (docs/community-benchmarks.md).
          EOF
          # The desktop app: bmoe-server with the web UI and the model catalog staged beside it.
          DESK="bmoe-desktop-$TAG-${{ matrix.target }}"
          mkdir -p "$DESK"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=build/bin/Release; SRV=bmoe-server.exe; else BIN=build/bin; SRV=bmoe-server; fi
          cp "$BIN/$SRV" "$DESK/"
          [ "${{ runner.os }}" = "Windows" ] || strip "$DESK/$SRV" || true
          libs "$DESK"
          cp -r "$BIN/ui" "$BIN/catalog" "$DESK/"
          cp LICENSE "$DESK/"
          cat > "$DESK/README.txt" <<EOF
          BigMoeOnEdge desktop $TAG, ${{ matrix.target }}

          Start $SRV (double-click it on Windows, or run ./$SRV --open) and use the page it opens
          at http://127.0.0.1:8765/. Download a model from the Models page or point it at a gguf you
          have. Everything runs on this machine; the server listens on this machine only.

          Settings and downloaded models live in your user data folder; ./$SRV --help lists the
          options. The HTTP API (OpenAI-compatible chat included) is documented in docs/server-api.md
          in the repository. Keep this folder together: the libraries beside the program are its
          compute backends, loaded at start-up; a GPU backend loads only where its driver is
          installed, and the Plan page says which devices were found.
          EOF
          if [ "${{ matrix.target }}" = windows-arm64-npu ]; then
            for f in "$NAME/README.txt" "$DESK/README.txt"; do
              cat >> "$f" <<'EOF'

          Hexagon NPU: this archive adds the NPU module and its DSP libraries. Windows runs them
          only after three things you do by hand once: the Qualcomm NPU driver, test-signing on, and
          the certificate beside this file (bigmoeonedge-npu.cer) trusted. Read what each step means
          and how to undo it first: https://github.com/Helldez/BigMoeOnEdge/blob/main/docs/npu-windows.md
          Without them the program still runs, on the CPU and GPU, as the plain archive does.
          EOF
            done
          fi
          # The binaries are ad-hoc signed, not notarised: a browser download is quarantined and
          # Gatekeeper refuses the first start. Say how to open them until a signed installer ships.
          if [ "${{ runner.os }}" = "macOS" ]; then
            for f in "$NAME/README.txt" "$DESK/README.txt"; do
              cat >> "$f" <<'EOF'

          macOS: these programs are not notarised yet, so a copy downloaded with a browser is
          quarantined and macOS refuses to open it the first time. Once, in Terminal, clear the
          quarantine on the extracted folder:
            xattr -dr com.apple.quarantine path/to/this/folder
          or right-click the program in Finder, choose Open, and confirm. A signed installer is
          planned (https://github.com/Helldez/BigMoeOnEdge/issues/234).
          EOF
            done
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            7z a -tzip "$DESK.zip" "$DESK" > /dev/null
            echo "assets=$NAME.zip $DESK.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            tar czf "$DESK.tar.gz" "$DESK"
            echo "assets=$NAME.tar.gz $DESK.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # The binaries must at least start on the runner they were built on.
      - name: Smoke
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            build/bin/Release/bmoe-cli.exe --version && build/bin/Release/bmoe-server.exe --version
          else
            build/bin/bmoe-cli --version && build/bin/bmoe-server --version
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSETS: ${{ steps.pkg.outputs.assets }}
        # ASSETS is a space-separated list of archive names made from the checked tag: split on purpose.
        run: gh release upload "$TAG" $ASSETS --clobber

      - name: Keep as workflow artifact (dry run)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.upload)
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: bmoe-*-${{ matrix.target }}.*

  ios-harness:
    runs-on: macos-14
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            release)           T="$RELEASE_TAG"; R="$T" ;;
            workflow_dispatch) T="$INPUT_TAG"; R="$T" ;;
            *)                 T="pr-$PR_NUMBER"; R="" ;;
          esac
          case "$T" in
            ''|*[!A-Za-z0-9._-]*) echo "not a plain tag name: '$T'"; exit 1 ;;
          esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "ref=$R" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}
          submodules: recursive

      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/check-version.sh "$TAG"

      - name: Configure & build (examples/ios, simulator)
        # The harness is the asset; the app is built by ci.yml's ios-harness job on every PR, so a
        # release does not fail on a target it does not ship.
        env:
          BMOE_IOS_TARGETS: bmoe-harness
        run: scripts/build-ios.sh sim

      - name: Package
        id: pkg
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APP="$(find build-ios-sim -maxdepth 4 -name bmoe-harness.app -type d | head -n 1)"
          [ -n "$APP" ] || { echo "no bmoe-harness.app in build-ios-sim"; exit 1; }
          NAME="bmoe-ios-harness-sim-$TAG"
          mkdir -p "$NAME"
          cp -R "$APP" "$NAME/"
          cp LICENSE "$NAME/"
          cat > "$NAME/README.txt" <<EOF
          BigMoeOnEdge iOS harness $TAG, for the iOS simulator on a Mac with Xcode (unsigned)

          bmoe-cli compiled into an app, since an app on iOS may not start a process. It proves
          the engine builds and runs on the platform; what a device does is a device's to say,
          and a device build is signed by whoever has one (examples/ios/README.md in the
          repository, and the call for a contributor in issue #235).

            xcrun simctl boot <device>                        # one of: xcrun simctl list devices
            xcrun simctl install booted bmoe-harness.app
            cp model.gguf "\$(xcrun simctl get_app_container booted io.bigmoeonedge.harness data)/Documents/"
            xcrun simctl launch --console booted io.bigmoeonedge.harness --bmoe --auto --plan -m model.gguf

          Everything after --bmoe goes to bmoe-cli; its --help lists the flags.
          EOF
          ditto -c -k --keepParent "$NAME" "$NAME.zip"
          echo "assets=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Upload asset to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSETS: ${{ steps.pkg.outputs.assets }}
        run: gh release upload "$TAG" $ASSETS --clobber

      - name: Keep as workflow artifact (dry run)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.upload)
        uses: actions/upload-artifact@v4
        with:
          name: ios-harness-sim
          path: bmoe-ios-harness-sim-*.zip
