# Builds bmoe-cli for desktop hosts when a release is published and attaches the archives to it,
# so a benchmark contributor can download one file and run scripts/bench-report.sh without a
# toolchain (docs/community-benchmarks.md). The desktop app also ships as a package per OS, built
# from the same staged folder as its archive by the scripts under packaging/: BigMoeOnEdge.app in a
# .dmg, a per-user installer .exe (Inno Setup) and an AppImage. Same clean-checkout rule as release-apk.yml: nothing
# from a developer machine rides into a published artifact.
#
# One layout on every OS: the executable and, beside it, one module per backend and one CPU module
# per instruction-set tier, the best picked at start-up (BMOE_BACKEND_MODULES, the top-level
# CMakeLists). A module whose driver library the machine lacks is not loaded and the engine runs on
# the CPU, so the same archive serves a laptop with a GPU and a server without one. Vulkan rides in
# the Linux and Windows archives; Metal in the macOS one; OpenCL in the Windows ARM64 one, for the
# Adreno GPU of a Snapdragon laptop. CUDA has an x86_64 Linux and Windows archive of its own (the
# CUDA pack), with the NVIDIA runtime and cuBLAS it links, which NVIDIA lets an application carry:
# twenty times the rest, so only an NVIDIA machine downloads it, into the folder of an archive or
# the installed app, where the engine loads it like the modules beside it; HIP in the x86_64 Linux
# one without ROCm, which is gigabytes and installed system-wide where an AMD card runs it. Where one
# card can be driven by more than one of them, the planner measures which drives it faster. The Hexagon NPU has archives of its own (windows-arm64-npu):
# on Windows its driver runs DSP code only from a catalog signed by a certificate the machine
# trusts, which the user sets up by hand, test-signing included (docs/npu-windows.md).
#
# iOS rides along as the harness app built for the simulator, unsigned: the one build of this
# engine for that platform anyone can run without an Apple team, on a Mac with Xcode
# (examples/ios/README.md). A device build is signed by whoever has the device.
name: release-host

on:
  release:
    types: [published]
  # A PR that edits this workflow or the packaging scripts builds all four targets as workflow
  # artifacts: the dry run.
  pull_request:
    paths: ['.github/workflows/release-host.yml', 'packaging/**']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (or any ref) to build; assets are named after it"
        required: true
      upload:
        description: "Attach to the release (true) or keep as workflow artifacts (false, a dry run)"
        type: boolean
        default: true

# Read everywhere: the build jobs run on pull requests too, and code built from a PR never holds a
# token that can write. Only `publish`, which builds nothing and runs on no PR, may write.
permissions:
  contents: read

jobs:
  # The HIP backend as a module, built in AMD's ROCm image because the toolkit is gigabytes and the
  # runner has none. Same checkout and flags as the Linux x86_64 build, so the module matches the
  # libraries it loads beside. It links ROCm's libraries and does not carry them: a machine with an
  # AMD card that runs ROCm has them installed system-wide (/opt/rocm/lib, also in its search
  # path), and on one without, the module is not loaded. The GPU targets: RDNA 2, 3 and 4 and the
  # Instinct parts llama.cpp's own builds name. ROCm 7, as llama.cpp's HIP CI: its kernels use the
  # warp-sync builtins older HIP headers lack, and the module needs that major version installed.
  hip-module:
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1
    steps:
      - name: Tools
        run: apt-get update -q && apt-get install -y -q git cmake ninja-build python3 hipblas-dev rocblas-dev
      - name: Resolve ref
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            release)           R="$RELEASE_TAG" ;;
            workflow_dispatch) R="$INPUT_TAG" ;;
            *)                 R="" ;;
          esac
          case "$R" in
            *[!A-Za-z0-9._-]*) echo "not a plain tag name: '$R'"; exit 1 ;;
          esac
          echo "ref=$R" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
          submodules: recursive
      - name: Build the HIP module
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          HIPCXX="$(hipconfig -l)/clang" HIP_PATH="$(hipconfig -R)" cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBMOE_BUILD_TESTS=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF \
            -DGGML_HIP=ON '-DGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201;gfx90a;gfx942' \
            -DBMOE_EXTRA_RPATH=/opt/rocm/lib
          cmake --build build -j --target ggml-hip
          mkdir -p hip-module && cp -P build/bin/libggml-hip.so hip-module/
          strip hip-module/libggml-hip.so || true
          ls -la hip-module
      - uses: actions/upload-artifact@v7
        with:
          name: hip-module
          path: hip-module

  cli:
    needs: hip-module
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image that can build a target sets the oldest distribution its archive runs
          # on, through the glibc and libstdc++ it links. x86_64 builds on 22.04 with the Vulkan
          # shader compiler from LunarG's apt repository, as llama.cpp's own release does, so the
          # archive runs where the previous ones did. aarch64 needs gcc-14 for the newest ARM tier
          # and glslc, which 22.04 on arm has neither of: it builds on 24.04, also as llama.cpp
          # does, and needs that glibc (2.38) or newer.
          - os: ubuntu-22.04
            target: linux-x86_64
            cuda: 12.8.1
            hip: true
            cmake_extra: >-
              -DGGML_VULKAN=ON -DGGML_CUDA=ON
              '-DCMAKE_CUDA_ARCHITECTURES=75-virtual;80-virtual;86-real;89-real;120-real'
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            cmake_extra: -DGGML_VULKAN=ON
          - os: macos-14
            target: macos-arm64
            cmake_extra: ""
          # Visual Studio 2022, not the latest image's 2026: CUDA 12 accepts host compilers up to
          # 2022 only, as llama.cpp's own Windows CUDA builds run.
          - os: windows-2022
            target: windows-x86_64
            cuda: 12.8.1
            # The shared C runtime: modules and the engine must share one heap, which a static
            # runtime in each would not. Its DLLs travel in the archive (Package), so a machine
            # without the redistributable installed still starts the binaries. Ninja with the
            # MSVC environment rather than the Visual Studio generator: CUDA under the latter needs
            # NVIDIA's Visual Studio integration installed, and the toolkit here is the
            # redistributable archives, not the installer.
            cmake_extra: >-
              -G Ninja -DGGML_VULKAN=ON -DGGML_CUDA=ON
              '-DCMAKE_CUDA_ARCHITECTURES=75-virtual;80-virtual;86-real;89-real;120-real'
          # Built natively on an ARM64 runner, so the smoke test runs what ships. llama.cpp's own
          # recipe for this target: clang with its toolchain file (one CPU library, for the cores
          # of a Snapdragon laptop; the top-level CMakeLists has ggml build no tiers here), the
          # Vulkan module, and the OpenCL module with the Adreno kernels.
          - os: windows-11-arm
            target: windows-arm64
            cmake_extra: >-
              -G "Ninja Multi-Config"
              -DCMAKE_TOOLCHAIN_FILE=third_party/llama.cpp/cmake/arm64-windows-llvm.cmake
              -DGGML_VULKAN=ON -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
          # The same build with the Hexagon module and one DSP library per NPU generation, signed
          # in this job (Sign the NPU's DSP libraries). Its own archives, because the NPU needs the
          # user to turn test-signing on, which the plain ones must never depend on. Single-config
          # Ninja, as llama.cpp's Snapdragon presets: the DSP libraries are ExternalProjects that
          # inherit the generator, and the Hexagon toolchain's compiler check fails in a
          # multi-config one, which tries a Debug link. The binaries then land in build/bin.
          - os: windows-11-arm
            target: windows-arm64-npu
            cmake_extra: >-
              -G Ninja
              -DCMAKE_TOOLCHAIN_FILE=third_party/llama.cpp/cmake/arm64-windows-llvm.cmake
              -DGGML_VULKAN=ON -DGGML_OPENCL=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
              -DGGML_HEXAGON=ON -DPREBUILT_LIB_DIR=windows_aarch64
              "-DHEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT" "-DHEXAGON_TOOLS_ROOT=$HEXAGON_TOOLS_ROOT"
            extra_targets: htp-v73 htp-v75 htp-v79 htp-v81 htp-v85
    runs-on: ${{ matrix.os }}
    steps:
      # The tag is text someone typed: it reaches the shell as data (env), never spliced into the
      # script, and only a plain ref name goes on to the steps after this one.
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `tag` names the archives; `ref` is what gets checked out. On a PR the ref stays empty,
          # which actions/checkout reads as "this PR's merge commit".
          case "$EVENT" in
            release)           T="$RELEASE_TAG"; R="$T" ;;
            workflow_dispatch) T="$INPUT_TAG"; R="$T" ;;
            *)                 T="pr-$PR_NUMBER"; R="" ;;
          esac
          case "$T" in
            ''|*[!A-Za-z0-9._-]*) echo "not a plain tag name: '$T'"; exit 1 ;;
          esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "ref=$R" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
          submodules: recursive

      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/check-version.sh "$TAG"

      # Vulkan needs its shader compiler and headers on the build host; the archive needs nothing
      # but a driver on the machine that runs it.
      - name: Install ninja and the Vulkan toolchain (Linux)
        if: runner.os == 'Linux'
        # 22.04 packages no glslc: the SDK comes from LunarG's repository, the recipe llama.cpp's
        # release uses there. On 24.04, gcc-14: the compiler it ships (13) does not build the
        # newest ARM tier of the CPU backend; the same workaround llama.cpp uses on that image.
        run: |
          if [ "$(lsb_release -rs)" = "22.04" ]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build vulkan-sdk
          else
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build glslc libvulkan-dev spirv-headers gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.4.357.0"
          # LunarG publishes the ARM64 SDK, a native glslc included, under its own path. Each
          # installer is checked against the SHA-256 LunarG publishes for it
          # (https://sdk.lunarg.com/sdk/sha/<version>/<platform>/<file>.txt): bump both with $v.
          if ($env:RUNNER_ARCH -eq "ARM64") {
            $url = "https://sdk.lunarg.com/sdk/download/$v/warm/vulkansdk-windows-ARM64-$v.exe"
            $sha = "c10f18a9085018f66e1f50bd60623f17b7081faca165248de54f78728120f334"
          } else {
            $url = "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
            $sha = "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"
          }
          curl.exe -fsSL -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe $url
          $got = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\VulkanSDK-Installer.exe").Hash.ToLower()
          if ($got -ne $sha) { throw "Vulkan SDK installer SHA-256 $got, expected $sha" }
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$v"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$v\bin"

      # clang and nvcc find the MSVC compiler, its libraries and the Windows SDK through the
      # environment vcvarsall sets up, which a job step does not start with: carried into the steps
      # after this one.
      - name: The MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ("${{ matrix.target }}".StartsWith("windows-arm64")) { "arm64" } else { "x64" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $arch >nul && set" | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])" }
          }

      # The OpenCL module links the ICD loader; the archive does not carry it, since the GPU driver
      # installs its own beside the system, and without one the module is simply not loaded.
      # Pinned releases of Khronos's headers and loader, built for this machine, as llama.cpp does.
      - name: Install the OpenCL headers and ICD loader (Windows ARM64)
        if: startsWith(matrix.target, 'windows-arm64')
        shell: pwsh
        run: |
          $v = "v2026.05.29"
          $prefix = "$env:RUNNER_TEMP\opencl"
          git clone -q --depth 1 --branch $v https://github.com/KhronosGroup/OpenCL-Headers "$env:RUNNER_TEMP\ocl-headers"
          cmake -S "$env:RUNNER_TEMP\ocl-headers" -B "$env:RUNNER_TEMP\ocl-headers\build" -DBUILD_TESTING=OFF -DOPENCL_HEADERS_BUILD_TESTING=OFF -DOPENCL_HEADERS_BUILD_CXX_TESTS=OFF "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build "$env:RUNNER_TEMP\ocl-headers\build" --target install
          git clone -q --depth 1 --branch $v https://github.com/KhronosGroup/OpenCL-ICD-Loader "$env:RUNNER_TEMP\ocl-loader"
          cmake -S "$env:RUNNER_TEMP\ocl-loader" -B "$env:RUNNER_TEMP\ocl-loader\build" -A arm64 -DBUILD_TESTING=OFF "-DCMAKE_PREFIX_PATH=$prefix" "-DCMAKE_INSTALL_PREFIX=$prefix"
          cmake --build "$env:RUNNER_TEMP\ocl-loader\build" --target install --config Release
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"

      # llama.cpp's own installer for the Windows on Snapdragon build of the Hexagon SDK: it checks
      # the archive's SHA-256 and unpacks it under C:\Qualcomm. The version is its default.
      - name: Install the Hexagon SDK (Windows ARM64 NPU)
        if: matrix.target == 'windows-arm64-npu'
        shell: pwsh
        run: |
          python third_party/llama.cpp/scripts/snapdragon/setup-sdk.py --hexagon
          $sdk = Get-ChildItem C:\Qualcomm\Hexagon_SDK -Directory | Select-Object -First 1
          $tools = Get-ChildItem "$($sdk.FullName)\tools\HEXAGON_Tools" -Directory | Select-Object -First 1
          # Forward slashes: these reach CMake as -D values, where a backslash would be read as an escape.
          Add-Content $env:GITHUB_ENV "HEXAGON_SDK_ROOT=$($sdk.FullName -replace '\\', '/')"
          Add-Content $env:GITHUB_ENV "HEXAGON_TOOLS_ROOT=$($tools.FullName -replace '\\', '/')"

      # The CUDA toolkit as NVIDIA's redistributable archives, each checked against the SHA-256 of
      # the release's manifest: the compiler, the runtime, the C++ core libraries and cuBLAS, and
      # nothing else (scripts/fetch-cuda-redist.py).
      - name: Fetch the CUDA toolkit
        if: matrix.cuda
        shell: bash
        env:
          CUDA_VERSION: ${{ matrix.cuda }}
        run: |
          case "${{ runner.os }}" in
            Windows) PLAT=windows-x86_64; PY=python ;;
            *) PLAT=linux-x86_64; PY=python3 ;;
          esac
          CUDA="$RUNNER_TEMP/cuda"
          $PY scripts/fetch-cuda-redist.py --version "$CUDA_VERSION" --platform "$PLAT" --out "$CUDA"
          if [ "${{ runner.os }}" = "Windows" ]; then CUDA="$(cygpath -m "$CUDA")"; fi
          echo "CUDAToolkit_ROOT=$CUDA" >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA" >> "$GITHUB_ENV"
          echo "CUDACXX=$CUDA/bin/nvcc" >> "$GITHUB_ENV"
          echo "$CUDA/bin" >> "$GITHUB_PATH"

      # The HIP module, built in the job below against ROCm, joins the modules of this archive.
      - name: The HIP module
        if: matrix.hip
        uses: actions/download-artifact@v7
        with:
          name: hip-module
          path: hip-module

      # The desktop app's web UI, built from the same checkout; the server build stages it beside
      # the binary (server/stage_assets.cmake).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the web UI
        shell: bash
        run: cd ui && npm ci && npm test && npm run build

      - name: Configure & build
        shell: bash
        run: |
          GEN=""
          if [ "${{ runner.os }}" != "Windows" ]; then GEN="-G Ninja"; fi
          cmake -S . -B build $GEN \
            -DCMAKE_BUILD_TYPE=Release \
            -DBMOE_BUILD_TESTS=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            ${{ matrix.cmake_extra }}
          cmake --build build --config Release -j --target bmoe-cli bmoe-server bmoe-server-assets ${{ matrix.extra_targets }}
          if [ -d hip-module ]; then cp -P hip-module/* build/bin/; fi

      # The catalog the NPU driver checks, libggml-htp.cat, made by Inf2Cat from upstream's
      # libggml-htp.inf and signed with a certificate made here. Its private key never leaves this
      # job: it is deleted from the store once the catalog is signed, so nothing else can ever be
      # signed with it, and only the public certificate ships for the user to trust. Inf2Cat comes
      # from Microsoft's WDK package on NuGet (the runner has no WDK); signtool from the SDK.
      - name: Sign the NPU's DSP libraries (Windows ARM64 NPU)
        if: matrix.target == 'windows-arm64-npu'
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $wdk = "10.0.28000.2526"
          curl.exe -sSL -o "$env:RUNNER_TEMP\wdk.zip" "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.arm64/$wdk/microsoft.windows.wdk.arm64.$wdk.nupkg"
          Expand-Archive "$env:RUNNER_TEMP\wdk.zip" "$env:RUNNER_TEMP\wdk"
          $inf2cat = (Get-ChildItem "$env:RUNNER_TEMP\wdk\c\bin\*\x86\Inf2Cat.exe" | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\arm64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $stage = "$env:RUNNER_TEMP\htp"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build\third_party\llama.cpp\ggml\src\ggml-hexagon\libggml-htp-v*.so $stage
          Copy-Item third_party\llama.cpp\ggml\src\ggml-hexagon\libggml-htp.inf $stage
          & $inf2cat /driver:$stage /os:10_25H2_ARM64
          if ($LASTEXITCODE) { throw "Inf2Cat failed ($LASTEXITCODE)" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=BigMoeOnEdge NPU $env:TAG" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          & $signtool sign /fd sha256 /sha1 $cert.Thumbprint /s My "$stage\libggml-htp.cat"
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)" }
          Export-Certificate -Cert $cert -FilePath "$stage\bigmoeonedge-npu.cer" | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          Remove-Item "$stage\libggml-htp.inf"
          Get-ChildItem $stage | Format-Table Name, Length
          Add-Content $env:GITHUB_ENV "HTP_STAGE=$stage"

      - name: Package
        id: pkg
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The engine and its libraries travel together: ggml and llama, and one module per
          # backend, which ggml finds beside the executable at start-up.
          # Where the Windows binaries are: build/bin/Release for a multi-config generator,
          # build/bin for the single-config one the NPU build uses.
          WB=build/bin/Release; [ -d "$WB" ] || WB=build/bin
          libs() { # <dir>: copy every shared library the build put beside the executables
            # -P keeps the soname symlinks as symlinks (libggml.so.0 -> libggml.so.0.x.y): the
            # executables name the versioned ones, and tar carries symlinks as they are.
            # On macOS the shared libraries are .dylib and the modules .so; both travel.
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "$WB"/*.dll "$1/"
              # The C++ runtime the binaries were linked against, copied beside them (the
              # redistributable allows this local deployment): without it a machine that never
              # installed the redistributable cannot start the program at all. The universal CRT
              # ships with Windows itself.
              # vcruntime140_1 holds the x64 exception handling: the ARM64 redistributable carries an
              # x64 copy of it for emulated programs, which nothing here loads, so it stays out.
              case "${{ matrix.target }}" in
                windows-arm64*) ARCH=arm64; WANT="msvcp140.dll vcruntime140.dll" ;;
                *) ARCH=x64; WANT="msvcp140.dll vcruntime140.dll vcruntime140_1.dll" ;;
              esac
              VS="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products "*" -property installationPath)"
              CRT="$(ls -d "$(cygpath -u "$VS")"/VC/Redist/MSVC/*/$ARCH/Microsoft.VC*.CRT | sort | tail -1)"
              cp "$CRT"/msvcp140*.dll "$CRT"/vcruntime140*.dll "$1/"
              if [ "$ARCH" = arm64 ]; then rm -f "$1/vcruntime140_1.dll"; fi
              for d in $WANT; do
                [ -f "$1/$d" ] || { echo "the C++ runtime is missing $d in $1"; exit 1; }
              done
            elif [ "${{ runner.os }}" = "macOS" ]; then cp -P build/bin/*.dylib build/bin/*.so "$1/"; strip -x "$1"/*.dylib "$1"/*.so || true;
            else cp -P build/bin/*.so* "$1/"; strip "$1"/*.so* || true; fi
            ls "$1" | grep -q 'ggml-cpu' || { echo "no CPU backend module in $1"; exit 1; }
            # And the GPU module this archive promises: a Vulkan SDK step that failed quietly would
            # otherwise ship a CPU-only archive under the name of one that carries Vulkan.
            case "${{ matrix.target }}" in
              macos-*) ls "$1" | grep -q 'ggml-metal' || { echo "no Metal backend module in $1"; exit 1; } ;;
              *) ls "$1" | grep -q 'ggml-vulkan' || { echo "no Vulkan backend module in $1"; exit 1; } ;;
            esac
            case "${{ matrix.target }}" in
              windows-arm64*) ls "$1" | grep -q 'ggml-opencl' || { echo "no OpenCL backend module in $1"; exit 1; } ;;
            esac
            # CUDA travels in an archive of its own (the CUDA pack, below): with the NVIDIA libraries
            # it links it is about twenty times the rest, which a machine without an NVIDIA card
            # would download for nothing.
            if [ -n "${{ matrix.cuda }}" ]; then rm -f "$1"/ggml-cuda.dll "$1"/libggml-cuda.so*; fi
            if [ "${{ matrix.hip }}" = "true" ]; then
              ls "$1" | grep -q 'ggml-hip' || { echo "no HIP backend module in $1"; exit 1; }
            fi
            # The NPU archives carry the Hexagon module, its DSP libraries, the signed catalog and
            # the certificate that signed it; the guide says what to do with them.
            if [ "${{ matrix.target }}" = windows-arm64-npu ]; then
              ls "$1" | grep -q 'ggml-hexagon' || { echo "no Hexagon backend module in $1"; exit 1; }
              cp "$(cygpath -u "$HTP_STAGE")"/* "$1/"
              for f in libggml-htp.cat bigmoeonedge-npu.cer libggml-htp-v73.so; do
                [ -f "$1/$f" ] || { echo "the NPU archive is missing $f in $1"; exit 1; }
              done
            fi
          }
          NAME="bmoe-cli-$TAG-${{ matrix.target }}"
          mkdir -p "$NAME"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$WB/bmoe-cli.exe" "$NAME/"
          else
            cp build/bin/bmoe-cli "$NAME/"
            strip "$NAME/bmoe-cli" || true
          fi
          libs "$NAME"
          cp LICENSE THIRD_PARTY_LICENSES "$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE='.\bmoe-cli.exe'; SHELL_NAME='PowerShell or cmd'
          else
            EXE='./bmoe-cli'; SHELL_NAME='a terminal'
          fi
          cat > "$NAME/README.txt" <<EOF
          bmoe-cli $TAG, ${{ matrix.target }}

          This is a command-line program. Double-clicking it opens a console that closes again at
          once, because it was given no model. Open $SHELL_NAME in this folder and run:

            $EXE -m path/to/model.gguf --moe-stream --overlap --dense-weights anon --cache-mb 2000 --io-threads 4 -t 8 -n 64 --chatml --no-think -p "Explain MoE routing."

          -m is the only required flag; $EXE --help lists the rest. Any MoE model llama.cpp loads
          streams (docs/which-models-stream.md in the repository). Keep this folder together: the
          libraries beside the program are its compute backends, loaded at start-up. The CPU one
          comes in several instruction-set tiers and the best for this machine is picked; a GPU
          backend loads only where its driver is installed, and the plan (--auto --plan-explain)
          says which devices were found. The Linux x86_64 archive runs on Ubuntu 22.04 and newer
          distributions; the aarch64 one needs glibc 2.38 or newer (Ubuntu 24.04, Debian 13,
          Fedora 39). On an older distribution build from source with scripts/build-host.sh, one
          command.

          Benchmark on this machine, printing the tables for a benchmark-report issue (Linux and
          macOS; on Windows run the protocol command from docs/community-benchmarks.md by hand):
            BMOE_CLI=\$PWD/bmoe-cli scripts/bench-report.sh /path/to/model.gguf
          from a checkout of https://github.com/Helldez/BigMoeOnEdge (docs/community-benchmarks.md).
          EOF
          # The desktop app: bmoe-server with the web UI and the model catalog staged beside it.
          DESK="bmoe-desktop-$TAG-${{ matrix.target }}"
          mkdir -p "$DESK"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=$WB; SRV=bmoe-server.exe; else BIN=build/bin; SRV=bmoe-server; fi
          cp "$BIN/$SRV" "$DESK/"
          [ "${{ runner.os }}" = "Windows" ] || strip "$DESK/$SRV" || true
          libs "$DESK"
          cp -r "$BIN/ui" "$BIN/catalog" "$DESK/"
          cp LICENSE THIRD_PARTY_LICENSES "$DESK/"
          cat > "$DESK/README.txt" <<EOF
          BigMoeOnEdge desktop $TAG, ${{ matrix.target }}

          Start $SRV (double-click it on Windows, or run ./$SRV --open) and use the page it opens
          at http://127.0.0.1:8765/. Download a model from the Models page or point it at a gguf you
          have. Everything runs on this machine; the server listens on this machine only.

          Settings and downloaded models live in your user data folder; ./$SRV --help lists the
          options. The HTTP API (OpenAI-compatible chat included) is documented in docs/server-api.md
          in the repository. Keep this folder together: the libraries beside the program are its
          compute backends, loaded at start-up; a GPU backend loads only where its driver is
          installed, and the Plan page says which devices were found.
          EOF
          if [ "${{ matrix.target }}" = windows-arm64-npu ]; then
            for f in "$NAME/README.txt" "$DESK/README.txt"; do
              cat >> "$f" <<'EOF'

          Hexagon NPU: this archive adds the NPU module and its DSP libraries. Windows runs them
          only after three things you do by hand once: the Qualcomm NPU driver, test-signing on, and
          the certificate beside this file (bigmoeonedge-npu.cer) trusted. Read what each step means
          and how to undo it first: https://github.com/Helldez/BigMoeOnEdge/blob/main/docs/npu-windows.md
          Without them the program still runs, on the CPU and GPU, as the plain archive does.
          EOF
            done
          fi
          if [ -n "${{ matrix.cuda }}" ]; then
            for f in "$NAME/README.txt" "$DESK/README.txt"; do
              cat >> "$f" <<EOF

          NVIDIA GPU: the CUDA backend is a download of its own, for its size:
          bmoe-cuda-$TAG-${{ matrix.target }} on the same release page. Extract it into this folder.
          EOF
            done
          fi
          # The binaries are ad-hoc signed, not notarised: a browser download is quarantined and
          # Gatekeeper refuses the first start. Say how to open them until a signed installer ships.
          if [ "${{ runner.os }}" = "macOS" ]; then
            for f in "$NAME/README.txt" "$DESK/README.txt"; do
              cat >> "$f" <<'EOF'

          macOS: these programs are not notarised yet, so a copy downloaded with a browser is
          quarantined and macOS refuses to open it the first time. Once, in Terminal, clear the
          quarantine on the extracted folder:
            xattr -dr com.apple.quarantine path/to/this/folder
          or right-click the program in Finder, choose Open, and confirm. A signed installer is
          planned (https://github.com/Helldez/BigMoeOnEdge/issues/234).
          EOF
            done
          fi
          # The CUDA pack: the module, the runtime and cuBLAS it links, and the licence they come
          # under, unpacked by the user into the folder of either archive or of the installed app,
          # where the engine loads modules from. The driver's own library (libcuda, nvcuda.dll) is
          # the machine's, and is the only thing the module may find missing beside the rest of an
          # archive: without it the module is not loaded and the rest runs.
          if [ -n "${{ matrix.cuda }}" ]; then
            PACK="bmoe-cuda-$TAG-${{ matrix.target }}"
            mkdir -p "$PACK"
            C="$(cygpath -u "$CUDAToolkit_ROOT" 2>/dev/null || echo "$CUDAToolkit_ROOT")"
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "$WB/ggml-cuda.dll" "$C"/bin/cudart64_12.dll "$C"/bin/cublas64_12.dll "$C"/bin/cublasLt64_12.dll "$PACK/"
            else
              cp -P build/bin/libggml-cuda.so* "$PACK/"
              strip "$PACK"/libggml-cuda.so* || true
              cp -P "$C"/lib/libcudart.so.12* "$C"/lib/libcublas.so.12* "$C"/lib/libcublasLt.so.12* "$PACK/"
              # Resolved as it will be: the pack beside the archive's own libraries.
              MISSING="$(LD_LIBRARY_PATH="$PWD/$DESK" ldd "$PACK"/libggml-cuda.so | grep 'not found' | grep -v 'libcuda\.so' || true)"
              [ -z "$MISSING" ] || { echo "the CUDA module needs libraries neither archive carries:"; echo "$MISSING"; exit 1; }
            fi
            cp "$C/LICENSE" "$PACK/LICENSE-CUDA.txt"
            cat > "$PACK/README-CUDA.txt" <<EOF
          BigMoeOnEdge CUDA backend $TAG, ${{ matrix.target }}

          The NVIDIA GPU backend, kept out of the main downloads for its size. Its files are at the
          top of the archive: extract it into the folder of bmoe-cli or bmoe-desktop $TAG for
          ${{ matrix.target }}, or of the installed app
          (%LOCALAPPDATA%\\Programs\\BigMoeOnEdge on Windows), so these files sit beside the
          program: it loads every backend it finds there at start-up, and the plan
          (--auto --plan-explain, or the Plan page) then shows the NVIDIA card. It needs the NVIDIA
          driver installed, and nothing else: the CUDA runtime and cuBLAS are here. The AppImage
          is read-only and cannot take it; on Linux use the bmoe-desktop archive instead.

          The NVIDIA libraries are NVIDIA's software, redistributed under LICENSE-CUDA.txt.
          EOF
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            7z a -tzip "$DESK.zip" "$DESK" > /dev/null
            # The pack's files at its top, no folder: extracted where the program is, they land beside it.
            [ -z "${PACK:-}" ] || 7z a -tzip "$PACK.zip" "./$PACK/*" > /dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
            tar czf "$DESK.tar.gz" "$DESK"
            [ -z "${PACK:-}" ] || tar czf "$PACK.tar.gz" -C "$PACK" .
          fi
          echo "desk=$DESK" >> "$GITHUB_OUTPUT"
          # The packages, from the folder the archive was just made of. Windows builds its
          # installer in the next step, from PowerShell, where ISCC's /D arguments stay as typed.
          case "${{ matrix.target }}" in
            macos-*) bash packaging/macos/make-app.sh "$DESK" "$TAG" . ;;
            linux-*) bash packaging/linux/make-appimage.sh "$DESK" "$TAG" "${{ matrix.target }}" . ;;
          esac

      # Inno Setup comes with the Windows runner images (x64 and ARM64; ISCC runs emulated on the
      # latter). The NPU target keeps its archives only: its setup is done by hand in the folder it
      # unpacks to (docs/npu-windows.md), which an installer would only hide.
      - name: Installer (Windows)
        if: matrix.target == 'windows-x86_64' || matrix.target == 'windows-arm64'
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DESK: ${{ steps.pkg.outputs.desk }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "no Inno Setup at $iscc" }
          $version = (& "$env:DESK\bmoe-server.exe" --version | Select-Object -First 1).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected server version '$version'" }
          $arch = if ("${{ matrix.target }}" -eq "windows-arm64") { "arm64" } else { "x64compatible" }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $env:DESK).Path)" "/DOutputDir=$PWD" `
            "/DOutputBaseName=BigMoeOnEdge-$env:TAG-${{ matrix.target }}-setup" "/DArch=$arch" packaging\windows\bigmoeonedge.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem BigMoeOnEdge-*-setup.exe | Format-Table Name, Length

      # The binaries must at least start on the runner they were built on.
      - name: Smoke
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            WB=build/bin/Release; [ -d "$WB" ] || WB=build/bin
            "$WB/bmoe-cli.exe" --version && "$WB/bmoe-server.exe" --version
          else
            build/bin/bmoe-cli --version && build/bin/bmoe-server --version
          fi

      # Each package started as a user would start it, with no model: the server must answer and
      # serve the web UI from inside the package, then stop.
      - name: Smoke the package
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          answers() { # the API and the built UI (not the "UI is not built" page) on the default port
            curl -fsS --retry 60 --retry-delay 1 --retry-connrefused http://127.0.0.1:8765/api/info
            echo
            curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="app"' || { echo "the UI is not served"; return 1; }
          }
          case "${{ matrix.target }}" in
            macos-*)
              codesign --verify --deep --strict BigMoeOnEdge.app
              DMG="BigMoeOnEdge-$TAG-${{ matrix.target }}.dmg"
              MNT="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
              [ -L "$MNT/Applications" ] || { echo "no Applications link in $DMG"; exit 1; }
              codesign --verify --deep --strict "$MNT/BigMoeOnEdge.app"
              "$MNT/BigMoeOnEdge.app/Contents/MacOS/bmoe-server" --version
              # The launcher starts the server; quitting the app stops it. SIGTERM takes the same
              # path as Stop and Quit, and needs no Apple Events permission on the runner.
              open "$MNT/BigMoeOnEdge.app"
              answers
              pkill -TERM -f 'BigMoeOnEdge.app/Contents/MacOS/BigMoeOnEdge'
              for i in $(seq 20); do pgrep -f 'BigMoeOnEdge.app/Contents/MacOS/' > /dev/null || break; sleep 1; done
              if pgrep -fl 'BigMoeOnEdge.app/Contents/MacOS/'; then echo "quitting the app left a process"; exit 1; fi
              hdiutil detach "$MNT"
              ;;
            linux-*)
              IMG="./BigMoeOnEdge-$TAG-${{ matrix.target }}.AppImage"
              chmod +x "$IMG"
              # The runner has no FUSE: the runtime extracts and runs instead.
              "$IMG" --appimage-extract-and-run --version
              "$IMG" --appimage-extract-and-run --port 8765 > server.log 2>&1 &
              PID=$!
              answers || { cat server.log; exit 1; }
              # The runtime runs AppRun as its child: stop the server itself, then the runtime.
              pkill -f 'usr/bin/bmoe-server' || true
              wait "$PID" || true
              ;;
            windows-x86_64 | windows-arm64)
              # A silent per-user install, then what the Start-menu entry starts, then the uninstall.
              ./BigMoeOnEdge-"$TAG"-${{ matrix.target }}-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
              APPDIR="$(cygpath -u "$LOCALAPPDATA")/Programs/BigMoeOnEdge"
              [ -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/BigMoeOnEdge.lnk" ] \
                || { echo "no Start-menu entry"; exit 1; }
              "$APPDIR/bmoe-server.exe" --version
              "$APPDIR/bmoe-server.exe" --port 8765 > server.log 2>&1 &
              answers || { cat server.log; exit 1; }
              taskkill //F //IM bmoe-server.exe
              sleep 2
              "$APPDIR/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
              for i in $(seq 30); do [ -e "$APPDIR/bmoe-server.exe" ] || break; sleep 1; done
              [ ! -e "$APPDIR/bmoe-server.exe" ] || { echo "the uninstall left bmoe-server.exe"; exit 1; }
              ;;
          esac

      # Always a workflow artifact: the dry run's result, and what `publish` attaches to a release.
      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: host-${{ matrix.target }}
          path: |
            bmoe-*-${{ matrix.target }}.*
            BigMoeOnEdge-*-${{ matrix.target }}.*
            BigMoeOnEdge-*-${{ matrix.target }}-setup.exe
          if-no-files-found: error

  ios-harness:
    runs-on: macos-14
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            release)           T="$RELEASE_TAG"; R="$T" ;;
            workflow_dispatch) T="$INPUT_TAG"; R="$T" ;;
            *)                 T="pr-$PR_NUMBER"; R="" ;;
          esac
          case "$T" in
            ''|*[!A-Za-z0-9._-]*) echo "not a plain tag name: '$T'"; exit 1 ;;
          esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "ref=$R" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.ref }}
          submodules: recursive

      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/check-version.sh "$TAG"

      - name: Configure & build (examples/ios, simulator)
        # The harness is the asset; the app is built by ci.yml's ios-harness job on every PR, so a
        # release does not fail on a target it does not ship.
        env:
          BMOE_IOS_TARGETS: bmoe-harness
        run: scripts/build-ios.sh sim

      - name: Package
        id: pkg
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APP="$(find build-ios-sim -maxdepth 4 -name bmoe-harness.app -type d | head -n 1)"
          [ -n "$APP" ] || { echo "no bmoe-harness.app in build-ios-sim"; exit 1; }
          NAME="bmoe-ios-harness-sim-$TAG"
          mkdir -p "$NAME"
          cp -R "$APP" "$NAME/"
          cp LICENSE THIRD_PARTY_LICENSES "$NAME/"
          cat > "$NAME/README.txt" <<EOF
          BigMoeOnEdge iOS harness $TAG, for the iOS simulator on a Mac with Xcode (unsigned)

          bmoe-cli compiled into an app, since an app on iOS may not start a process. It proves
          the engine builds and runs on the platform; what a device does is a device's to say,
          and a device build is signed by whoever has one (examples/ios/README.md in the
          repository, and the call for a contributor in issue #235).

            xcrun simctl boot <device>                        # one of: xcrun simctl list devices
            xcrun simctl install booted bmoe-harness.app
            cp model.gguf "\$(xcrun simctl get_app_container booted io.bigmoeonedge.harness data)/Documents/"
            xcrun simctl launch --console booted io.bigmoeonedge.harness --bmoe --auto --plan -m model.gguf

          Everything after --bmoe goes to bmoe-cli; its --help lists the flags.
          EOF
          ditto -c -k --keepParent "$NAME" "$NAME.zip"

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-harness-sim
          path: bmoe-ios-harness-sim-*.zip
          if-no-files-found: error

  # Attaches what the build jobs made to the release: the one job with write access, and it runs
  # nothing from the checkout. always(): a target that failed to build does not hold back the ones
  # that built, as when each job attached its own (the failed job still fails the run).
  publish:
    needs: [cli, ios-harness]
    if: always() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.upload))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            release) T="$RELEASE_TAG" ;;
            *)       T="$INPUT_TAG" ;;
          esac
          case "$T" in
            ''|*[!A-Za-z0-9._-]*) echo "not a plain tag name: '$T'"; exit 1 ;;
          esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"

      # Every artifact of this run is an archive or a package a build job made for this tag.
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Upload assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(assets/bmoe-* assets/BigMoeOnEdge-*)
          [ ${#files[@]} -gt 0 ] || { echo "no archive to attach"; exit 1; }
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
