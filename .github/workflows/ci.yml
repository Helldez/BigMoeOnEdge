name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # Every pull request, whatever its base: a PR stacked on another branch is merged one day too,
  # and filtered to `main` it reached that day with no build behind it.
  pull_request:
    paths-ignore: [ '**/*.md', 'docs/**', 'LICENSE', '.gitignore' ]
  workflow_dispatch: {}

# A newer push to the same ref cancels the older, still-running CI — so a burst of commits
# spends minutes only on the last one instead of building every intermediate commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise: only the APK job's release attach writes, and it asks for
# that itself.
permissions:
  contents: read

jobs:
  # Does this push carry anything a build could break?
  #
  # `paths-ignore` handles that for pull requests, but it cannot be put on the push trigger: the
  # same trigger carries the release tags, and a tag push has no commit range for a path filter to
  # read, so filtering here would silence the tag build that attaches the APK. Hence the decision
  # is made once, in ten seconds, and each build job is gated on it.
  #
  # Anything not a push (pull_request, workflow_dispatch) and every tag build answers "yes"
  # unconditionally — this is a saver for docs merges, not a second opinion on what to test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          say() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "code=$1"; }
          case "$EVENT:$REF" in
            push:refs/tags/*) say true; exit 0 ;;
            push:*) ;;
            *) say true; exit 0 ;;
          esac
          # A branch created by this push, or a force-push past the old head, leaves nothing to
          # diff against; build rather than guess.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            say true; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$SHA")
          echo "changed:"; echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)'; then
            say true
          else
            say false
          fi

  # The engine, the app and the changelog state one version between them.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions agree (and match the tag, on a tag build)
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check-version.sh "$TAG"

  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: clang-format (our sources only)
        # Pinned to 18 because AGENTS.md tells contributors to match that version locally. Plain
        # `clang-format` is whatever the runner image ships, which happens to be 18 today: an image
        # bump would silently start failing every PR against a version nobody was told about.
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18
          find core cli server tests -type f \( -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror

  host-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          python3 -m pip install --upgrade pip
          python3 -m pip install gguf numpy
      - name: Configure & build
        # The diagnostic tools link the I/O layer on their own, so a change to it that only the
        # engine build sees would otherwise leave them broken until someone measures with them.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBMOE_BUILD_TOOLS=ON && cmake --build build -j
      - name: Byte-identity gates
        run: cd build && ctest --output-on-failure

  sanitizers:
    # The same gates under AddressSanitizer and UndefinedBehaviorSanitizer. The streamer rebinds
    # tensor->data onto buffers it allocates itself and fills from several I/O lanes, which is where
    # an overrun or a use-after-free would hide from a byte-identity check: the output can still
    # match. llama.cpp is instrumented too, so ggml's reads of those buffers are checked as well;
    # its own findings, which this project does not patch (AGENTS.md hard rule 1), are listed one
    # by one in tests/sanitizers/ubsan.supp. RelWithDebInfo: close to the Release code shape the
    # gates normally see, with line numbers in the reports.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          python3 -m pip install --upgrade pip
          python3 -m pip install gguf numpy
      - name: Configure & build (ASan + UBSan)
        run: |
          SAN="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j
      - name: Byte-identity gates, sanitized
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tests/sanitizers/ubsan.supp
        run: cd build-asan && ctest --output-on-failure

  ui:
    # The web UI's unit tests (ui/src/lib). release-host runs them too, but only once a release is
    # being cut; this is where a PR finds out.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web UI unit tests
        run: cd ui && npm ci && npm test
      # svelte-check type-checks the components and the TypeScript the unit tests do not reach; the
      # build is what release-host stages beside bmoe-server, so a PR finds out here if it breaks.
      - name: Type check
        run: cd ui && npm run check
      - name: Build
        run: cd ui && npm run build

  host-windows:
    # Windows minutes bill at 2x. It only compile-checks the Win32 I/O paths, so run it where it
    # matters — PRs (before merge) and release tags — not on every main push (already tested on PR).
    # Compile-only on purpose: the gates have never run on Windows (MSVC, the RPC loopback gate's
    # Winsock path, the tiny-model generator under the runner's Python), and switching them on
    # unverified would turn every PR red rather than test anything. Enable them once they have been
    # run on a Windows machine.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure & build (compile-check the Win32 I/O paths)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBMOE_BUILD_TESTS=OFF -DBMOE_BUILD_TOOLS=ON
          cmake --build build --config Release -j

  host-macos:
    # The Apple path on PRs, gates included: release-host builds __APPLE__ code only when a
    # release is cut, and builds no tests, so this is where F_NOCACHE and the Apple VM paths are
    # proven to stream byte-identically.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The runner's own python3 is externally managed (PEP 668), so pip may not install into it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps (the gates' tiny-model generator)
        run: python3 -m pip install gguf numpy
      # Keep this in sync with the macos-arm64 release-host configuration, which differs only in
      # leaving the tests out.
      - name: Configure & build (the Apple I/O paths, and the gates)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF
          cmake --build build --config Release -j
      - name: Smoke
        run: build/bin/bmoe-cli --version && build/bin/bmoe-server --version
      - name: Byte-identity gates
        run: cd build && ctest --output-on-failure

  ios-harness:
    # Compile-check the iOS paths: the engine and bmoe-cli inside the harness app, for the
    # simulator, unsigned. Nothing is run; the simulator's kernel and memory are the runner's.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure & build (examples/ios, simulator)
        run: scripts/build-ios.sh sim

  # Cross-compiles the arm64 engine (the native compile gate) and packages the example
  # APK around it, uploading the APK as an artifact — and attaching it to the release on a
  # tag push. Debug-signed: for on-device validation, not Play distribution.
  android-apk:
    # The long job (NDK + cross-compile + gradle). Build it on PRs (catch APK breakage before merge)
    # and on release tags (attach the APK), but not on every main push. Trigger a one-off manually
    # with the Run workflow button (workflow_dispatch) if you need a fresh main APK between releases.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the tag-triggered release attach step
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up NDK
        # Third-party action, pinned by commit SHA: a mutable tag here would run whatever the
        # upstream repo points it at, inside a job that holds a contents:write token.
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          # r27c == 27.2.12479018, the NDK release-apk.yml builds published APKs with. These two
          # must not drift, or CI validates a build nobody installs.
          ndk-version: r27c
      - name: Cross-compile bmoe-cli (arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DBMOE_BUILD_TESTS=OFF -DBMOE_BUILD_SERVER=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_OPENCL=OFF \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod+fp16" \
            -DLLAMA_CURL=OFF
          cmake --build build-android -j
      - name: Stage engine binaries into jniLibs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          jni=examples/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$jni"
          cp build-android/bin/bmoe-cli "$jni/libbmoe-cli.so"
          cp build-android/bin/bmoe-server "$jni/libbmoe-server.so"
          find build-android \( -name 'libggml*.so' -o -name 'libllama*.so' \) -exec cp {} "$jni/" \;
          # bmoe-cli links the c++_shared STL; ship its runtime from the NDK sysroot.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$jni/"
          ls -la "$jni"
      - name: Build debug APK (dev flavor — sideloaded, all-files access)
        working-directory: examples/android
        run: ./gradlew assembleDevDebug --no-daemon
      - name: App unit tests
        working-directory: examples/android
        run: ./gradlew testDevDebugUnitTest --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmoe-example-dev-debug-apk
          path: examples/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned by commit SHA for the same reason. This step only runs on a tag push, so a
        # wrong pin would not surface until a release: resolve the SHA, do not hand-edit it.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: examples/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
