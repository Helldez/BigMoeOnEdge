ystem, 'Segoe UI', Helvetica, Arial, sans-serif">The planner measures, then writes a plan for this device. Same rules everywhere, a different plan on each machine.</text><rect x="40" y="110" width="300" height="400" rx="10" fill="#160D27" stroke="#6C5AA8" stroke-width="2"/><text x="60" y="142" font-size="15" fill="#6C5AA8" font-weight="800" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 · MEASURE</text><rect x="60" y="166" width="260" height="54" rx="6" fill="#1F1436" stroke="#2E2148" stroke-width="2"/><text x="76" y="190" font-size="16" fill="#F2EEFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the model</text><text x="76" y="209" font-size="13" fill="#B3A9D1" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">its header: layers, experts, sizes</text><rect x="60" y="232" width="260" height="54" rx="6" fill="#1F1436" stroke="#2E2148" stroke-width="2"/><text x="76" y="256" font-size="16" fill="#F2EEFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">memory</text><text x="76" y="275" font-size="13" fill="#B3A9D1" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">what this process may hold</text><rect x="60" y="298" width="260" height="54" rx="6" fill="#1F1436" stroke="#2E2148" stroke-width="2"/><text x="76" y="322" font-size="16" fill="#F2EEFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">storage</text><text x="76" y="341" font-size="13" fill="#B3A9D1" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">read speed at the expert's size</text><rect x="60" y="364" width="260" height="54" rx="6" fill="#1F1436" stroke="#2E2148" stroke-width="2"/><text x="76" y="388" font-size=