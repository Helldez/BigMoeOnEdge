nchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prompt</text><text x="926" y="414" font-size="15" fill="#F2EEFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">NPU (Hexagon)</text><rect x="840" y="438" width="74" height="28" rx="6" fill="#0A0512" stroke="#B3A9D1" stroke-width="2"/><text x="852" y="455" font-size="14" fill="#B3A9D1" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">answer</text><text x="926" y="458" font-size="15" fill="#F2EEFF" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">CPU</text><text x="840" y="494" font-size="13" fill="#B3A9D1" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">experts stream, cache sized to free RAM</text><text x="1160" y="540" font-size="13" fill="#B3A9D1" font-weight="400" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the plans measured on the machines in the video</text></svg>