<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda Garden</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#info {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  color: #fff; background: rgba(0,0,0,0.55); padding: 8px 18px;
  border-radius: 20px; font-size: 13px; pointer-events: none;
  backdrop-filter: blur(6px); letter-spacing: 0.3px;
}
#loading {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 22px; letter-spacing: 2px;
}
</style>
</head>
<body>
<div id="info">🏯 Voxel Pagoda Garden — Drag to orbit · Scroll to zoom</div>
<div id="loading">Building garden...</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ───
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 500);
camera.position.set(45, 35, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 15;
controls.maxDistance = 120;
controls.update();

// ─── Lighting ───
const ambientLight = new THREE.AmbientLight(0x8899bb, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
sunLight.shadow.camera.far = 120;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x88aacc, 0.4);
fillLight.position.set(-20, 15, -10);
scene.add(fillLight);

const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a5f0b, 0.5);
scene.add(hemiLight);

// ─── Voxel System ───
const voxelSize = 0.5;
const voxelGeo = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);

const voxelInstances = [];

function addVoxel(x, y, z, color) {
  voxelInstances.push({ x, y, z, color });
}

function buildVoxels() {
  const uniqueColors = [...new Set(voxelInstances.map(v => v.color))];

  for (const color of uniqueColors) {
    const voxels = voxelInstances.filter(v => v.color === color);
    const mat = new THREE.MeshStandardMaterial({
      color, roughness: 0.8, metalness: 0.05
    });
    const mesh = new THREE.InstancedMesh(voxelGeo, mat, voxels.length);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const dummy = new THREE.Object3D();
    voxels.forEach((v, i) => {
      dummy.position.set(v.x * voxelSize, v.y * voxelSize, v.z * voxelSize);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });

    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  }
}

// ─── Color Palette ───
const C = {
  grass: '#4a7c3f', grassLight: '#5a8f4a', grassDark: '#3d6b34',
  dirt: '#8b6f47', stone: '#9e9e9e', stoneLight: '#b0b0b0', stoneDark: '#7a7a7a',
  wood: '#6b4226', woodDark: '#4a2e1a', woodLight: '#8b6340',
  red: '#c41e3a', redDark: '#8b1528', redLight: '#e8354a',
  gold: '#d4a017', goldLight: '#f0c040', goldDark: '#a07810',
  roof: '#2c2c2c', roofDark: '#1a1a1a', roofLight: '#3a3a3a',
  white: '#f5f5f0', cream: '#faf5e8',
  water: '#3a8abf', waterDeep: '#2a6a9f', waterShallow: '#5aaad0',
  pink: '#ffb7c5', pinkDark: '#e8899a', pinkLight: '#ffd0d9',
  sakura: '#ff9eb5', sakuraLight: '#ffc8d4', sakuraDark: '#e07090',
  green: '#2d8a4e', greenDark: '#1a6b35', greenLight: '#45a868',
  brown: '#5c3a1e', brownLight: '#7a5230',
  lantern: '#ffcc66', lanternGlow: '#ffe088',
  rock: '#888888', rockDark: '#666666',
  sand: '#d4b896', sandLight: '#e8d0a8',
  bamboo: '#6b8e23', bambooLight: '#8ab340',
  flower1: '#ff6b9d', flower2: '#ffa07a', flower3: '#dda0dd',
  flower4: '#98fb98', flower5: '#87ceeb',
  koi: '#ff6633', koiWhite: '#f0f0f0', koiGold: '#ffcc00',
};

// ─── Helper: Box Builder ───
function box(x0, y0, z0, x1, y1, z1, color) {
  for (let x = Math.min(x0,x1); x <= Math.max(x0,x1); x++)
    for (let y = Math.min(y0,y1); y <= Math.max(y0,y1); y++)
      for (let z = Math.min(z0,z1); z <= Math.max(z0,z1); z++)
        addVoxel(x, y, z, color);
}

// ─── Ground ───
function buildGround() {
  const size = 50;
  for (let x = -size; x <= size; x++) {
    for (let z = -size; z <= size; z++) {
      const dist = Math.sqrt(x*x + z*z);
      let y = 0;
      // Gentle rolling hills
      y += Math.floor(Math.sin(x * 0.08) * Math.cos(z * 0.06) * 1.5);
      y += Math.floor(Math.sin(x * 0.15 + 2) * 0.5);

      // Pond depression
      const pondCx = 18, pondCz = -15;
      const pondDist = Math.sqrt((x-pondCx)**2 + (z-pondCz)**2);
      if (pondDist < 10) {
        y = Math.min(y, -1);
      }

      // Path elevation (slightly raised)
      const pathZ = 0;
      if (Math.abs(z - pathZ) <= 1 && Math.abs(x) < 35) y = Math.max(y, 0);

      const pathX = 0;
      if (Math.abs(x - pathX) <= 1 && Math.abs(z) < 35) y = Math.max(y, 0);

      // Pond edge
      if (pondDist >= 9 && pondDist <= 11 && y <= -1) y = 0;

      // Determine color
      let color;
      if (pondDist < 9) {
        const wave = Math.sin(x * 0.5 + z * 0.3) * 0.1;
        color = wave > 0 ? C.waterShallow : C.water;
      } else if (pondDist >= 9 && pondDist <= 10) {
        color = C.sand;
      } else {
        const noise = Math.sin(x * 0.3) * Math.cos(z * 0.4) * 0.5 + 0.5;
        if (noise < 0.3) color = C.grassDark;
        else if (noise > 0.7) color = C.grassLight;
        else color = C.grass;
      }

      // Dirt below grass
      if (y > 0) {
        addVoxel(x, y - 1, z, C.dirt);
        if (y > 1) addVoxel(x, y - 2, z, C.dirt);
      }

      addVoxel(x, y, z, color);
    }
  }
}

// ─── Pond ───
function buildPond() {
  const cx = 18, cz = -15;
  for (let x = cx - 9; x <= cx + 9; x++) {
    for (let z = cz - 7; z <= cz + 7; z++) {
      const dx = (x - cx) / 9, dz = (z - cz) / 7;
      if (dx*dx + dz*dz < 1) {
        addVoxel(x, 0, z, C.water);
        // Water surface shimmer
        if ((x + z) % 3 === 0) {
          addVoxel(x, 0.1, z, C.waterShallow);
        }
      }
    }
  }
  // Koi fish (colorful voxels under water)
  const koiPositions = [
    [cx-3, -0.3, cz-2], [cx+2, -0.3, cz+3], [cx+5, -0.3, cz-1],
    [cx-1, -0.3, cz+4], [cx+4, -0.3, cz+2], [cx-5, -0.3, cz+1]
  ];
  const koiColors = [C.koi, C.koiWhite, C.koiGold, C.koi, C.koiGold, C.koiWhite];
  koiPositions.forEach((p, i) => {
    addVoxel(p[0], p[1], p[2], koiColors[i]);
    addVoxel(p[0]+1, p[1], p[2], koiColors[i]);
  });
}

// ─── Stone Path ───
function buildPaths() {
  // Main path to pagoda
  for (let x = -30; x <= 5; x++) {
    const w = 2 + Math.floor(Math.sin(x * 0.2) * 0.5);
    for (let dx = -w; dx <= w; dx++) {
      const stone = (x + dx) % 3 === 0 ? C.stoneLight : C.stone;
      addVoxel(x, 0.05, dx, stone);
      addVoxel(x, -0.05, dx, C.stoneDark);
    }
  }
  // Cross path
  for (let z = -25; z <= 25; z++) {
    const w = 1 + Math.floor(Math.sin(z * 0.15) * 0.5);
    for (let dz = -w; dz <= w; dz++) {
      const stone = (z + dz) % 3 === 0 ? C.stoneLight : C.stone;
      addVoxel(dz, 0.05, z, stone);
    }
  }
  // Path to pond
  for (let x = 5; x <= 25; x++) {
    for (let dz = -1; dz <= 1; dz++) {
      addVoxel(x, 0.05, -15 + dz, C.stone);
    }
  }
}

// ─── Pagoda ───
function buildPagoda() {
  const baseX = 0, baseZ = 0;
  const tiers = 5;
  let currentY = 1;

  // Foundation steps
  for (let step = 0; step < 3; step++) {
    const s = 8 - step;
    box(baseX - s, step, baseZ - s, baseX + s, step, baseZ + s,
      step === 0 ? C.stoneDark : C.stone);
  }
  currentY = 3;

  for (let t = 0; t < tiers; t++) {
    const tierWidth = 6 - t;
    const tierHeight = 4;

    // Walls
    const wallColor = t % 2 === 0 ? C.red : C.cream;
    box(baseX - tierWidth, currentY, baseZ - tierWidth,
        baseX + tierWidth, currentY + tierHeight - 1, baseZ + tierWidth, wallColor);

    // Inner walls (darker)
    box(baseX - tierWidth + 1, currentY, baseZ - tierWidth + 1,
        baseX + tierWidth - 1, currentY + tierHeight - 1, baseZ + tierWidth - 1,
        t % 2 === 0 ? C.woodDark : C.wood);

    // Windows/doors on each face
    const doorY = currentY + 1;
    // Front door
    box(baseX - 1, doorY, baseZ + tierWidth, baseX + 1, doorY + 1, baseZ + tierWidth, C.woodDark);
    // Back
    box(baseX - 1, doorY, baseZ - tierWidth, baseX + 1, doorY + 1, baseZ - tierWidth, C.woodDark);
    // Side windows
    box(baseX + tierWidth, doorY, baseZ - 1, baseX + tierWidth, doorY + 1, baseZ + 1, C.gold);
    box(baseX - tierWidth, doorY, baseZ - 1, baseX - tierWidth, doorY + 1, baseZ + 1, C.gold);

    // Corner pillars
    const pillarColor = C.woodDark;
    const corners = [[-1,-1],[1,-1],[1,1],[-1,1]];
    for (const [cx, cz] of corners) {
      box(baseX + cx * tierWidth, currentY, baseZ + cz * tierWidth,
          baseX + cx * tierWidth, currentY + tierHeight - 1, baseZ + cz * tierWidth, pillarColor);
    }

    // Roof
    const roofY = currentY + tierHeight;
    const roofOverhang = 2;
    const roofW = tierWidth + roofOverhang;

    // Curved roof using stepped approach
    for (let ry = 0; ry < 3; ry++) {
      const rw = roofW - ry;
      if (rw <= 0) break;
      const roofColor = ry === 0 ? C.roofLight : (ry === 1 ? C.roof : C.roofDark);
      box(baseX - rw, roofY + ry, baseZ - rw,
          baseX + rw, roofY + ry, baseZ + rw, roofColor);
    }

    // Roof corner upturns
    const roofTipY = roofY + 3;
    for (const [cx, cz] of corners) {
      box(baseX + cx * roofW, roofY, baseZ + cz * roofW,
          baseX + cx * roofW, roofTipY, baseZ + cz * roofW, C.gold);
      // Corner ornaments
      addVoxel(baseX + cx * roofW, roofTipY + 1, baseZ + cz * roofW, C.goldLight);
    }

    // Eave decorations (small gold accents along roof edge)
    for (let e = -roofW; e <= roofW; e += 2) {
      addVoxel(baseX + e, roofY, baseZ + roofW + 1, C.gold);
      addVoxel(baseX + e, roofY, baseZ - roofW - 1, C.gold);
      addVoxel(baseX + roofW + 1, roofY, baseZ + e, C.gold);
      addVoxel(baseX - roofW - 1, roofY, baseZ + e, C.gold);
    }

    currentY = roofY + 3;
  }

  // Spire / finial on top
  const spireBaseY = currentY;
  box(baseX - 1, spireBaseY, baseZ - 1, baseX + 1, spireBaseY + 5, baseZ + 1, C.gold);
  box(baseX, spireBaseY + 6, baseZ, baseX, spireBaseY + 9, baseZ, C.goldLight);
  // Spire rings
  for (let r = 0; r < 4; r++) {
    const ringY = spireBaseY + 2 + r * 2;
    box(baseX - 2, ringY, baseZ - 2, baseX + 2, ringY, baseZ + 2, C.gold);
  }
  // Top jewel
  addVoxel(baseX, spireBaseY + 10, baseZ, C.redLight);
  addVoxel(baseX, spireBaseY + 11, baseZ, C.goldLight);
}

// ─── Cherry Blossom Tree ───
function buildCherryTree(x, y, z, scale = 1) {
  // Trunk
  const trunkH = Math.floor(5 * scale);
  for (let ty = 0; ty < trunkH; ty++) {
    const taper = ty > trunkH - 2 ? 0 : 1;
    box(x - taper, y + ty, z - taper, x + taper, y + ty, z + taper, C.woodDark);
  }

  // Branches
  const branchEnds = [
    [2, 2, 0], [-2, 1, 1], [1, 3, -2], [-1, 2, -1],
    [0, 4, 2], [3, 1, -1], [-3, 0, 0], [0, 3, -3]
  ];
  for (const [bx, by, bz] of branchEnds) {
    const len = Math.floor(Math.abs(bx) + Math.abs(bz));
    for (let b = 0; b < len; b++) {
      const t = b / len;
      const px = Math.floor(x + bx * t);
      const py = Math.floor(y + trunkH * 0.6 + by * t);
      const pz = Math.floor(z + bz * t);
      addVoxel(px, py, pz, C.wood);
    }
  }

  // Canopy - cherry blossom clusters
  const canopyCenterY = y + trunkH + 1;
  const canopyRadius = Math.floor(4 * scale);
  const blossomColors = [C.pink, C.pinkDark, C.pinkLight, C.sakura, C.sakuraLight];

  for (let cx = -canopyRadius; cx <= canopyRadius; cx++) {
    for (let cy = -canopyRadius; cy <= canopyRadius; cy++) {
      for (let cz = -canopyRadius; cz <= canopyRadius; cz++) {
        const dist = Math.sqrt(cx*cx + cy*cy + cz*cz);
        if (dist < canopyRadius && Math.random() < 0.55) {
          const color = blossomColors[Math.floor(Math.random() * blossomColors.length)];
          addVoxel(x + cx, canopyCenterY + cy, z + cz, color);
        }
      }
    }
  }

  // Falling petals
  for (let i = 0; i < 12; i++) {
    const px = x + Math.floor((Math.random() - 0.5) * 10);
    const py = y + Math.floor(Math.random() * 6);
    const pz = z + Math.floor((Math.random() - 0.5) * 10);
    addVoxel(px, py, pz, blossomColors[Math.floor(Math.random() * blossomColors.length)]);
  }
}

// ─── Pine Tree ───
function buildPineTree(x, y, z, scale = 1) {
  const trunkH = Math.floor(4 * scale);
  for (let ty = 0; ty < trunkH; ty++) {
    box(x, y + ty, z, x, y + ty, z, C.woodDark);
  }

  // Cone layers
  const layers = Math.floor(4 * scale);
  for (let l = 0; l < layers; l++) {
    const layerY = y + trunkH - 1 + l * 1.5;
    const radius = Math.floor((4 - l * 0.7) * scale);
    const green = l % 2 === 0 ? C.greenDark : C.green;
    for (let dx = -radius; dx <= radius; dx++) {
      for (let dz = -radius; dz <= radius; dz++) {
        if (Math.abs(dx) + Math.abs(dz) <= radius + 1) {
          addVoxel(x + dx, Math.floor(layerY), z + dz, green);
        }
      }
    }
  }
}

// ─── Bamboo Cluster ───
function buildBamboo(x, y, z, count = 5) {
  for (let b = 0; b < count; b++) {
    const bx = x + Math.floor((Math.random() - 0.5) * 4);
    const bz = z + Math.floor((Math.random() - 0.5) * 4);
    const height = 8 + Math.floor(Math.random() * 5);
    for (let h = 0; h < height; h++) {
      const segColor = h % 3 === 0 ? C.bambooLight : C.bamboo;
      box(bx, y + h, bz, bx, y + h, bz, segColor);
      // Nodes
      if (h % 3 === 0) {
        box(bx - 1, y + h, bz - 1, bx + 1, y + h, bz + 1, C.bambooLight);
      }
    }
    // Leaves at top
    for (let l = 0; l < 6; l++) {
      const lx = bx + Math.floor((Math.random() - 0.5) * 3);
      const lz = bz + Math.floor((Math.random() - 0.5) * 3);
      addVoxel(lx, y + height, lz, C.greenLight);
      addVoxel(lx, y + height + 1, lz, C.greenLight);
    }
  }
}

// ─── Stone Lantern ───
function buildLantern(x, y, z) {
  // Base
  box(x - 1, y, z - 1, x + 1, y, z + 1, C.stone);
  // Pillar
  box(x, y + 1, z, x, y + 2, z, C.stone);
  // Light chamber
  box(x - 1, y + 3, z - 1, x + 1, y + 3, z + 1, C.stoneLight);
  // Lantern glow
  addVoxel(x, y + 3, z, C.lantern);
  // Roof
  box(x - 1, y + 4, z - 1, x + 1, y + 4, z + 1, C.stoneDark);
  box(x, y + 5, z, x, y + 5, z, C.stoneDark);
  // Top ornament
  addVoxel(x, y + 6, z, C.stone);
}

// ─── Wooden Bridge ───
function buildBridge(x, y, z) {
  const bridgeLen = 8;
  for (let i = -bridgeLen; i <= bridgeLen; i++) {
    const arch = Math.floor(Math.cos(i / bridgeLen * Math.PI / 2) * 2);
    const by = y + arch;

    // Deck
    box(x + i, by, z - 1, x + i, by, z + 1, C.wood);

    // Railings
    if (i % 2 === 0) {
      box(x + i, by + 1, z - 1, x + i, by + 1, z - 1, C.woodDark);
      box(x + i, by + 1, z + 1, x + i, by + 1, z + 1, C.woodDark);
    }
    // Rail top
    if (i % 2 === 0) {
      box(x + i, by + 2, z - 1, x + i, by + 2, z - 1, C.red);
      box(x + i, by + 2, z + 1, x + i, by + 2, z + 1, C.red);
    }
  }
  // Side rails connecting
  for (let i = -bridgeLen; i <= bridgeLen; i += 2) {
    const arch = Math.floor(Math.cos(i / bridgeLen * Math.PI / 2) * 2);
    const by = y + arch;
    if (i < bridgeLen) {
      box(x + i + 1, by + 2, z - 1, x + i + 1, by + 2, z - 1, C.red);
      box(x + i + 1, by + 2, z + 1, x + i + 1, by + 2, z + 1, C.red);
    }
  }
}

// ─── Rocks ───
function buildRock(x, y, z, size = 2) {
  for (let dx = -size; dx <= size; dx++) {
    for (let dy = -size; dy <= size; dy++) {
      for (let dz = -size; dz <= size; dz++) {
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < size && Math.random() < 0.6) {
          const rock = Math.random() > 0.5 ? C.rock : C.rockDark;
          addVoxel(x + dx, y + dy, z + dz, rock);
        }
      }
    }
  }
}

// ─── Flowers ───
function buildFlowerPatch(x, z, count = 15) {
  const flowerColors = [C.flower1, C.flower2, C.flower3, C.flower4, C.flower5];
  for (let i = 0; i < count; i++) {
    const fx = x + Math.floor((Math.random() - 0.5) * 6);
    const fz = z + Math.floor((Math.random() - 0.5) * 6);
    const stemH = 1 + Math.floor(Math.random() * 2);
    for (let s = 0; s < stemH; s++) {
      addVoxel(fx, 1 + s, fz, C.green);
    }
    const fc = flowerColors[Math.floor(Math.random() * flowerColors.length)];
    addVoxel(fx, 1 + stemH, fz, fc);
    if (Math.random() > 0.5) {
      addVoxel(fx + 1, 1 + stemH, fz, fc);
      addVoxel(fx, 1 + stemH, fz + 1, fc);
    }
  }
}

// ─── Decorative Fence ───
function buildFence(startX, startZ, endX, endZ, color = C.wood) {
  const dx = Math.sign(endX - startX);
  const dz = Math.sign(endZ - startZ);
  let cx = startX, cz = startZ;

  while (cx !== endX || cz !== endZ) {
    // Post
    box(cx, 1, cz, cx, 2, cz, color);
    addVoxel(cx, 3, cz, color);
    // Rails
    if (cx !== startX) {
      box(cx - dx, 1.5, cz, cx, 1.5, cz, color);
      box(cx - dx, 2.5, cz, cx, 2.5, cz, color);
    }
    if (cz !== startZ) {
      box(cx, 1.5, cz - dz, cx, 1.5, cz, color);
      box(cx, 2.5, cz - dz, cx, 2.5, cz, color);
    }

    if (cx !== endX) cx += dx;
    if (cz !== endZ) cz += dz;
  }
}

// ─── Stupa / Small Shrine ───
function buildStupa(x, y, z) {
  // Base
  box(x - 2, y, z - 2, x + 2, y, z + 2, C.stone);
  box(x - 1, y + 1, z - 1, x + 1, y + 2, z + 1, C.cream);
  // Dome
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      const dist = Math.abs(dx) + Math.abs(dz);
      if (dist <= 1) {
        addVoxel(x + dx, y + 3, z + dz, C.cream);
      }
    }
  }
  // Spire
  box(x, y + 4, z, x, y + 6, z, C.gold);
  addVoxel(x, y + 7, z, C.goldLight);
}

// ─── Stone Steps around Pagoda ───
function buildSteps(x, y, z, width = 4) {
  for (let step = 0; step < 3; step++) {
    const sw = width + step;
    box(x - sw, y - step, z, x + sw, y - step, z + 1, C.stoneLight);
  }
}

// ─── Mossy Stones ───
function buildMossyStone(x, y, z) {
  addVoxel(x, y, z, C.rock);
  addVoxel(x + 1, y, z, C.rockDark);
  addVoxel(x, y, z + 1, C.rock);
  // Moss on top
  addVoxel(x, y + 1, z, C.greenDark);
  addVoxel(x + 1, y + 1, z, C.green);
  addVoxel(x, y + 1, z + 1, C.greenDark);
}

// ─── Build Everything ───
buildGround();
buildPond();
buildPaths();
buildPagoda();

// Cherry blossom trees
buildCherryTree(-12, 0, -8, 1.1);

// Pine trees
buildPineTree(-25, 0, -15, 1.3);

// Bamboo
buildBamboo(-20, 0, -20, 8);

// Stone lanterns
buildLantern(-5, 0, 5);

buildRock(-6, 0, -12, 2);

// Flower patches
buildFlowerPatch(-10, 8, 20);

// Fences
buildFence(-10, 0, -10, 10, C.woodDark);

// ─── Build all voxels into instanced meshes ───
buildVoxels();

// ─── Sky Dome ───
const skyGeo = new THREE.SphereGeometry(200, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor: { value: new THREE.Color(0x4488cc) },
    bottomColor: { value: new THREE.Color(0xddeeff) },
    offset: { value: 20 },
    exponent: { value: 0.4 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + offset).y;
      gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ─── Falling Petals Animation ───
const petalCount = 200;
const petalGeo = new THREE.PlaneGeometry(0.15, 0.15);
const petalMat = new THREE.MeshBasicMaterial({
  color: C.pinkLight, side: THREE.DoubleSide, transparent: true, opacity: 0.8
});
const petals = new THREE.InstancedMesh(petalGeo, petalMat, petalCount);
const petalData = [];
const petalDummy = new THREE.Object3D();

for (let i = 0; i < petalCount; i++) {
  petalData.push({
    x: (Math.random() - 0.5) * 80,
    y: Math.random() * 30 + 5,
    z: (Math.random() - 0.5) * 80,
    speed: 0.02 + Math.random() * 0.04,
    drift: (Math.random() - 0.5) * 0.03,
    rotSpeed: 0.01 + Math.random() * 0.03,
    phase: Math.random() * Math.PI * 2
  });
  petalDummy.position.set(petalData[i].x, petalData[i].y, petalData[i].z);
  petalDummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  petalDummy.updateMatrix();
  petals.setMatrixAt(i, petalDummy.matrix);
}
scene.add(petals);

// ─── Fireflies (evening atmosphere) ───
const fireflyCount = 40;
const fireflyGeo = new THREE.SphereGeometry(0.08, 4, 4);
const fireflyMat = new THREE.MeshBasicMaterial({ color: C.lanternGlow });
const fireflies = new THREE.InstancedMesh(fireflyGeo, fireflyMat, fireflyCount);
const fireflyData = [];
const fireflyDummy = new THREE.Object3D();

for (let i = 0; i < fireflyCount; i++) {
  fireflyData.push({
    x: (Math.random() - 0.5) * 50,
    y: 2 + Math.random() * 8,
    z: (Math.random() - 0.5) * 50,
    phase: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 1.5,
    radius: 1 + Math.random() * 3
  });
  fireflyDummy.position.set(fireflyData[i].x, fireflyData[i].y, fireflyData[i].z);
  fireflyDummy.updateMatrix();
  fireflies.setMatrixAt(i, fireflyDummy.matrix);
}
scene.add(fireflies);

// ─── Animation ───
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.update();

  // Animate falling petals
  for (let i = 0; i < petalCount; i++) {
    const p = petalData[i];
    p.y -= p.speed;
    p.x += Math.sin(t * 0.5 + p.phase) * 0.02 + p.drift;
    p.z += Math.cos(t * 0.3 + p.phase) * 0.01;

    if (p.y < 0) {
      p.y = 25 + Math.random() * 10;
      p.x = (Math.random() - 0.5) * 80;
      p.z = (Math.random() - 0.5) * 80;
    }

    petalDummy.position.set(p.x, p.y, p.z);
    petalDummy.rotation.set(t * p.rotSpeed, t * p.rotSpeed * 1.3, 0);
    petalDummy.updateMatrix();
    petals.setMatrixAt(i, petalDummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  // Animate fireflies
  for (let i = 0; i < fireflyCount; i++) {
    const f = fireflyData[i];
    const fx = f.x + Math.sin(t * f.speed + f.phase) * f.radius;
    const fy = f.y + Math.sin(t * f.speed * 0.7 + f.phase) * 1.5;
    const fz = f.z + Math.cos(t * f.speed * 0.8 + f.phase) * f.radius;
    const glow = 0.5 + 0.5 * Math.sin(t * 2 + f.phase);

    fireflyDummy.position.set(fx, fy, fz);
    fireflyDummy.scale.setScalar(glow);
    fireflyDummy.updateMatrix();
    fireflies.setMatrixAt(i, fireflyDummy.matrix);
  }
  fireflies.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}

// ─── Resize ───
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Start ───
document.getElementById('loading').style.display = 'none';
animate();

</script>
